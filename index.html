<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주짓수 화이트벨트 영상</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261112e">
</head>
<body>
<div id="scroll">
<div class="wrap">
<header>
  <div class="eyebrow" id="site-eyebrow">노량진 주짓수락 · White Belt</div>
  <h1 id="site-title">화이트벨트 기술 영상</h1>
  <p class="lede" id="site-lede">기술 이름을 누르면 해당 기술 영상으로 이동합니다.</p>
  <div class="preview" id="preview-banner" hidden>관리자 페이지에서 편집 중인 내용을 미리 보는 중입니다. 아직 반영된 내용이 아닙니다.</div>
  <div class="score" id="site-scores" aria-label="기본 점수 체계"></div>
</header>

<div class="bar">
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="기술 검색 (예: 암바, 스윕, 라쏘)" aria-label="기술 검색" autocomplete="off"></div>
    <div class="seg" id="lang-seg" role="group" aria-label="검색 언어">
      <button id="lang-ko" type="button" aria-pressed="true">한국어 검색</button>
      <button id="lang-en" type="button" aria-pressed="false">English 검색</button>
    </div>
  </div>
  <nav id="nav" aria-label="분류"></nav>
</div>

<main id="main"></main>

<footer>
  <p id="site-footer"></p>
  <p id="admin-link-wrap"><a id="admin-link" href="admin">관리자</a></p>
</footer>
</div>
</div>
<script src="data.js?v=20261112e"></script>
<script src="js/shared.js?v=20261112e"></script>
<script src="js/app.js?v=20261112e"></script>
</body>
</html>
