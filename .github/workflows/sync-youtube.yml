name: 유튜브 영상 동기화

on:
  schedule:
    - cron: '20 * * * *'      # 테스트용: 매시 20분 (확인 후 원하는 시각으로 변경). 주의: 이 줄은 저장소 주인 계정 이름으로 커밋해야 예약이 돈다
  workflow_dispatch:         # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 새 영상 확인 및 data.js 갱신
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node sync/sync.mjs | tee "$GITHUB_STEP_SUMMARY"
      - name: 변경이 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js sync/videos.json
            git commit -m "유튜브 새 영상 자동 동기화"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
