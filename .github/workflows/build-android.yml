name: 안드로이드 앱(APK) 빌드

# android 폴더가 바뀌면 자동으로 빌드하고, Actions 탭에서 수동으로도 돌릴 수 있습니다.
# 결과 APK는 Releases 의 "android-latest" 에 올라갑니다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK 빌드
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease -Pvc=${{ github.run_number }} 2>&1 | tee ../build.log

      - name: 실패하면 원인을 요약에 남기기
        if: failure()
        run: |
          {
            echo "### 빌드 실패 로그 (마지막 80줄)"
            echo '```'
            tail -n 80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$(grep -m1 -E 'What went wrong|error:|FAILURE' -A3 build.log | tr '\n' ' ' | cut -c1-400)"

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk jiujitsu.apk
          ls -la jiujitsu.apk
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest jiujitsu.apk \
            --target "${GITHUB_SHA}" \
            --title "안드로이드 앱 (APK)" \
            --notes "주짓수 樂 가이드 안드로이드 앱입니다. 설치 방법은 사이트의 install.html 을 보세요. (빌드 #${{ github.run_number }})" \
            --latest=false
          {
            echo "### 안드로이드 APK 빌드 완료"
            echo "- 다운로드: https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/jiujitsu.apk"
          } >> "$GITHUB_STEP_SUMMARY"
